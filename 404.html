<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <meta charset="utf-8" />
    <title>Zhu Dai's collection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfdfd;
        }
        #app {
            width: 100%;
            min-height: 100vh;
        }
        nav {
            background: gray;
            padding: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        nav a.router-link-active {
            border-bottom: 2px solid #fff;
        }
        .centered {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            color: #bbbbbb;
            font-family: 'Fira Code', monospace;
        }
        #app,
        #app * {
            font-family: "Space Grotesk", Arial, sans-serif !important;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-C_kLZWoo.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-6wTNU3Ev.css">
</head>
<body>
<div class="centered">DAI</div>
<div id="app"></div>
<script>
(() => {
  const app = document.getElementById("app");
  if (!app) return;
  const updateQuestionsLink = () => {
    app.querySelectorAll("nav a").forEach((link) => {
      if (link.textContent.trim().toLowerCase() !== "home") return;
      link.textContent = "questions";
      link.setAttribute("href", "/");
      if (link.dataset.questionsHomeFixed) return;
      link.dataset.questionsHomeFixed = "true";
      link.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign("/");
      }, true);
    });
  };
  new MutationObserver(updateQuestionsLink).observe(app, { childList: true, subtree: true });
  updateQuestionsLink();
})();
</script>
</body>
</html>
